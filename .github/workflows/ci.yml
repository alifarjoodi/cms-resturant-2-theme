name: CI

# The one test gate. It runs on every pull request, and `publish-image.yml` calls it
# (`workflow_call`) before building the GHCR image, so "the tests pass" has a single
# definition. There is deliberately no `push: main` trigger: a merge starts the
# publisher, which runs this workflow first — adding the trigger would run it twice.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Validate manifest, lint, typecheck, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Validate Eshobe manifest
        run: npm run validate:manifest
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build

  audits:
    name: Browser audits (a11y + interaction)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The audits run against the theme server, exactly as on a host:
      # `npm run test:browser` launches real Chromium (@sparticuz/chromium) against
      # `server.js` with a mock CMS and writes screenshots to `test-results/`.
      - name: Run browser audits
        run: npm run test:browser
      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-reports
          path: test-results/*
          if-no-files-found: ignore

  image:
    name: Image build (no push)
    # The publisher builds the image for real; this proves the Dockerfile on PRs only.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=image
          cache-to: type=gha,mode=max,scope=image
